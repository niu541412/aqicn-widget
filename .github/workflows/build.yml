name: Build extensions

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in src/*.js; do node --check "$file"; done
      - name: Build Chrome and Firefox packages
        run: python scripts/build.py
      - name: Check package contents
        run: python scripts/check.py
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python -c "import json, os; assert os.environ['GITHUB_REF_NAME'] == 'v' + json.load(open('manifest.json'))['version']"
      - uses: actions/upload-artifact@v4
        with:
          name: aqicn-widget-extensions
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aqicn-widget-extensions
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
